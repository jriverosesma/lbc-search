[project]
name = "lbc-search"
version = "0.1.0"
requires-python = ">=3.11"
authors = [{ name = "jriverosesma", email = "jriverosesma@gmail.com" }]

dependencies = [
  "dataclasses-json>=0.6.7,<0.7",
  "haversine>=2.9.0,<3", 
  "lbc>=1.1.2,<2",
]

[project.scripts]
lbc = "lbc_search.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11,<3.13"

[tool.pixi.pypi-dependencies]
"lbc-search" = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
black = "*"
isort = "*"
pre-commit = "*"
ruff = "*"

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.tasks]
setup = "pre-commit install"
