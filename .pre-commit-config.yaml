# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2  # Replace with the latest Ruff version
    hooks:
    -   id: ruff
        name: ruff (lint + fix)
        # Run the linter.
        args: [ --fix ]
        # Run the formatter.
    -   id: ruff-format