line-length = 88
target-version = "py311"

[format]
# Ruff formatter aims to be Black-compatible.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint]
# Keep the rule set "classic" but avoid fights with Black/isort.
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

ignore = [
  "E501",  # line length handled by formatter/Black
  "E203",  # whitespace before ':' (Black)
]

fixable = ["ALL"]
unfixable = []

[lint.isort]
# Align Ruff's import sorting with isort/Black expectations.
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true
order-by-type = false

# If you use src-layout, consider:
# src = ["src"]
# And set your import root(s):
# known-first-party = ["your_package_name"]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"tests/**" = ["S101"]        # if you later enable bandit ("S")

[lint.mccabe]
max-complexity = 10